# Server port
server.port=8081

# H2 Database Connection
spring.datasource.url=jdbc:h2:file:./data/skillversedb;DB_CLOSE_DELAY=-1;AUTO_SERVER=TRUE
spring.datasource.driverClassName=org.h2.Driver
spring.datasource.username=sa
spring.datasource.password=
spring.jpa.database-platform=org.hibernate.dialect.H2Dialect

# Enable H2 Console to view the database in the browser (http://localhost:8081/h2-console)
spring.h2.console.enabled=true
spring.h2.console.path=/h2-console
spring.h2.console.settings.web-allow-others=true

# Hibernate/JPA Configuration
# update: automatically updates the database schema based on your entities
spring.jpa.hibernate.ddl-auto=update

# Show SQL queries in the console for learning purposes
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true

# Upload and request limits for base64 image data
spring.servlet.multipart.max-file-size=50MB
spring.servlet.multipart.max-request-size=50MB
server.tomcat.max-http-form-post-size=50MB
server.tomcat.max-swallow-size=50MB
spring.codec.max-in-memory-size=50MB
